name: ezicart_buyer_mobile
description: "EZiCart Buyer Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Instrument Sans
      fonts:
        - asset: assets/fonts/InstrumentSans.ttf
    - family: Bodoni Moda
      fonts:
        - asset: assets/fonts/BodoniModa.ttf
